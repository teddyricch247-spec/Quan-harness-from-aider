# Reproducible Aider deployment for a faculty / classroom demo.
#
# Brings up Aider plus an optional local OpenAI-compatible model server (Ollama)
# so the whole stack runs without any cloud API keys.
#
#   docker compose up --build aider
#   docker compose up            # includes the local Ollama model server
#
# Aider is a client: it never bundles a model. Point it at any backend by
# overriding AIDER_MODEL / AIDER_OPENAI_API_BASE below.

services:
  aider:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: aider
    image: aider:local
    # Run as the current host user so edited files keep correct ownership.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
      - aider-cache:/home/appuser/.aider
    environment:
      AIDER_ANALYTICS: "false"
      # Default to the bundled local model server; override for cloud providers.
      AIDER_MODEL: "openai/qwen2.5-coder:7b"
      AIDER_OPENAI_API_BASE: "http://ollama:11434/v1"
    # Uncomment to forward a cloud provider key instead of the local server.
    # environment:
    #   AIDER_ANALYTICS: "false"
    #   OPENAI_API_KEY: "${OPENAI_API_KEY}"
    #   AIDER_MODEL: "gpt-4o"
    networks:
      - aider-net
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - aider-net
    # Pull a small coder model once the container is up:
    #   docker compose exec ollama ollama pull qwen2.5-coder:7b

volumes:
  aider-cache:
  ollama-data:

networks:
  aider-net:
    driver: bridge
