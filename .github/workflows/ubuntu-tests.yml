name: Ubuntu Python Tests

# Professional CI: lint, type-check, tests, build, CLI smoke, security.
# Runs on every PR and on pushes to main. Network/paid-API tests are skipped
# by default (see tests/conftest.py + the `network` marker); run the manual
# integration-tests.yml workflow for real-model/network coverage.

on:
  push:
    paths-ignore:
      - 'aider/website/**'
      - 'README.md'
      - 'HISTORY.md'
      - '.github/workflows/*'
      - '!.github/workflows/ubuntu-tests.yml'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'aider/website/**'
      - 'README.md'
      - 'HISTORY.md'
      - '.github/workflows/*'
      - '!.github/workflows/ubuntu-tests.yml'
    branches:
      - main

# Least-privilege by default. Nothing here needs write access.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint / format validation (fail fast before running the heavier jobs)
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        # black >=24 supports Python 3.12+ (the version pinned in
        # .pre-commit-config.yaml, 23.3.0, cannot parse 3.12+ AST).
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.1.0 black isort==5.12.0 codespell==2.2.6

      - name: Get changed Python files
        id: changed
        run: |
          git fetch origin main --quiet || true
          BASE=origin/main
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then BASE=HEAD~1; fi
          FILES=$(git diff --name-only "$BASE"...HEAD -- '*.py' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: flake8
        if: ${{ steps.changed.outputs.files != '' }}
        run: flake8 --show-source ${{ steps.changed.outputs.files }}

      - name: black (check only)
        if: ${{ steps.changed.outputs.files != '' }}
        run: black --check --line-length 100 --preview ${{ steps.changed.outputs.files }}

      - name: isort (check only)
        if: ${{ steps.changed.outputs.files != '' }}
        run: isort --check-only --profile black ${{ steps.changed.outputs.files }}

      - name: codespell
        if: ${{ steps.changed.outputs.files != '' }}
        run: codespell --skip="aider/website/docs/languages.md" ${{ steps.changed.outputs.files }}

  # ---------------------------------------------------------------------------
  # 2. Static / type checks (advisory: not enforced by the project yet)
  # ---------------------------------------------------------------------------
  type-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Run mypy
        run: mypy aider > mypy_report.txt 2>&1 || true

      - name: Upload type-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy_report.txt
          retention-days: 5

  # ---------------------------------------------------------------------------
  # 3. Unit + integration tests (offline; network tests skipped via marker)
  # ---------------------------------------------------------------------------
  test:
    needs: [quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs full history for versioning

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 'requirements/requirements-dev.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests (offline; network tests excluded)
        env:
          AIDER_ANALYTICS: false
        run: |
          pytest -q -m "not network" --junitxml=test-results.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test-results.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Package / build validation
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 5. CLI smoke test (install the built wheel, exercise the entrypoint)
  # ---------------------------------------------------------------------------
  cli-smoke:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install wheel in a clean environment
        run: |
          python -m pip install --upgrade pip
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl

      - name: "Smoke test: --help"
        run: /tmp/smoke/bin/aider --help

      - name: "Smoke test: --version"
        run: /tmp/smoke/bin/aider --version

      - name: "Smoke test: import + no-network config check"
        env:
          AIDER_ANALYTICS: false
        run: |
          /tmp/smoke/bin/python -c "import aider; from aider.main import main; print('import OK')"
          # Verify a BYOK-style endpoint is accepted without a key at CLI parse time.
          /tmp/smoke/bin/aider --openai-api-base http://localhost:11434/v1 --model gpt-4o --help

  # ---------------------------------------------------------------------------
  # 6. Security / dependency checks (advisory)
  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pip install pip-audit

      - name: Run pip-audit
        env:
          AIDER_ANALYTICS: false
        run: pip-audit -r requirements.txt --desc on > pip-audit-report.txt 2>&1 || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.txt
          retention-days: 7
